<tr>
    <!-- Nome do item listado (ex.: instituição, curso, etc.) -->
    <th scope="row">{{name}}</th>
    <!-- Coluna com os botões de ação -->
    <td>
        <!-- Botão para abrir os detalhes do item -->
        <button class="btn btn-secondary btn-icon rounded-circle me-2" title="Abrir">
            <i class="bi bi-folder2-open"></i>
        </button>
         <!-- Botão para editar o item -->
        <button class="btn btn-secondary btn-icon rounded-circle me-2" title="Alterar">
            <i class="bi bi-pencil text-light"></i>
        </button>
        <!-- Botão para excluir o item -->
        <button class="btn btn-secondary btn-icon rounded-circle me-2" title="Excluir">
            <i class="bi bi-trash"></i>
        </button>
    </td>
</tr>
