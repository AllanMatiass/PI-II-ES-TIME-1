<!-- Modal usado para exibir mensagens de erro -->
<div class="modal fade" id="errors-modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <!-- Cabeçalho do modal, onde fica o título do erro -->
            <div class="modal-header">
                <h5 class="modal-title" id="error-modal-title"></h5>
                <!-- Botão para fechar o modal -->
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <!-- Corpo do modal, onde a lista de erros será exibida -->
            <div class="modal-body">
                <ul class="list-group" id="modal-errors-list"></ul>
            </div>
        </div>
    </div>
</div>
