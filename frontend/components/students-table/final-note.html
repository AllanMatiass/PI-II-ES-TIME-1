<div class="final-note-line d-flex align-items-center gap-2 mt-2" data-final="true">
    <span><b>Final:</b></span>

    <!-- Campo numérico que exibe a nota final do aluno
         Está desabilitado porque o usuário não pode editar manualmente,
         apenas visualizar o valor calculado -->
    <input 
        type="number" 
        disabled 
        class="form-control form-control-sm bg-light final-grade-input"
        value="{{value}}"
    />
</div>
